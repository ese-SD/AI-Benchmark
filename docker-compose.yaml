version: '3.8'

services:
  data_loader:
    build: ./src/data_loader
    volumes:
      - ./data/datasets:/data/datasets 
    networks:
      - ml_network

  pytorch:
    build: ./src/modeles_ia/pytorch
    volumes:
      # Lecture seule (:ro)
      - ./data/datasets:/data/datasets:ro
    depends_on:
      data_loader:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
    networks:
      - ml_network

  tensorflow:
    build: ./src/modeles_ia/tensorflow
    volumes:
      # Lecture seule (:ro)
      - ./data/datasets:/data/datasets:ro
    depends_on:
      data_loader:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 3G
    networks:
      - ml_network

networks:
  ml_network:
    driver: bridge